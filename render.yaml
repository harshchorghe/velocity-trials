services:
  - type: web
    name: velocity-trails-backend
    env: node
    buildCommand: "cd Backend && npm install && npx prisma generate && npm run build"
    startCommand: "cd Backend && npx prisma db push --accept-data-loss && npm run seed && npm start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: velocity-trails-db
          property: connectionString
      - key: PORT
        value: 4000
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: velocity-trails-db
    databaseName: velocity_trails
    user: velocity_admin
